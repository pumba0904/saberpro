<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Docente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .sidebar { background: #1e293b; min-height: 100vh; padding: 20px 0; width: 250px; position: fixed; }
        .sidebar .brand { color: #e94560; font-size: 20px; font-weight: 700; padding: 10px 20px 30px; }
        .sidebar a { display: block; color: #94a3b8; text-decoration: none; padding: 12px 20px; font-size: 14px; }
        .sidebar a:hover, .sidebar a.active { background: #0f172a; color: #e94560; }
        .sidebar a i { margin-right: 10px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .top-bar { background: #1e293b; padding: 15px 30px; margin-left: 250px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .stat-card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
        .stat-card .number { font-size: 36px; font-weight: 700; color: #e94560; }
        .stat-card .label { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="bi bi-mortarboard"></i> Saber Pro</div>
        <a href="/docente/dashboard" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/docente/estudiantes/buscar"><i class="bi bi-search"></i> Buscar Estudiante</a>
        <a href="/docente/estudiantes"><i class="bi bi-people"></i> Todos los Estudiantes</a>
        <a href="/logout" style="position:absolute; bottom:20px; width:100%;"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a>
    </div>

    <div class="top-bar">
        <h5 class="mb-0">Dashboard Docente</h5>
        <span class="text-muted" th:text="${#authentication.name}">docente</span>
    </div>

    <div class="main-content">
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="number" th:text="${totalEstudiantes}">0</div>
                    <div class="label"><i class="bi bi-people me-1"></i>Total Estudiantes</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="number" th:text="${totalAprobados}">0</div>
                    <div class="label"><i class="bi bi-check-circle me-1"></i>Aprobados Saber Pro</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="number" th:text="${totalFacultades}">0</div>
                    <div class="label"><i class="bi bi-building me-1"></i>Facultades</div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="stat-card">
                    <h6 class="mb-3" style="color:#e94560;">Acciones Rápidas</h6>
                    <a href="/docente/estudiantes/buscar" class="btn btn-outline-danger btn-sm me-2 mb-2">
                        <i class="bi bi-search"></i> Buscar por Cédula
                    </a>
                    <a href="/docente/estudiantes" class="btn btn-outline-danger btn-sm mb-2">
                        <i class="bi bi-people"></i> Ver por Facultad
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
