<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Facultades - Saber Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .sidebar {
            background: #1e293b;
            min-height: 100vh;
            padding: 20px 0;
            width: 250px;
            position: fixed;
        }
        .sidebar .brand { color: #e94560; font-size: 20px; font-weight: 700; padding: 10px 20px 30px; }
        .sidebar a { display: block; color: #94a3b8; text-decoration: none; padding: 12px 20px; font-size: 14px; }
        .sidebar a:hover, .sidebar a.active { background: #0f172a; color: #e94560; }
        .sidebar a i { margin-right: 10px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .top-bar { background: #1e293b; padding: 15px 30px; margin-left: 250px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .card-table { background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
        table thead th { color: #94a3b8; border-color: #334155; font-size: 13px; }
        table tbody td { color: #e2e8f0; border-color: #334155; }
        table tbody tr:hover { background: #0f172a; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="bi bi-mortarboard"></i> Saber Pro</div>
        <a href="/admin/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/admin/directores"><i class="bi bi-person-badge"></i> Directores</a>
        <a href="/admin/docentes"><i class="bi bi-person-workspace"></i> Docentes</a>
        <a href="/admin/facultades" class="active"><i class="bi bi-building"></i> Facultades</a>
        <a href="/logout" style="position:absolute; bottom:20px; width:100%;"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a>
    </div>

    <div class="top-bar">
        <h5 class="mb-0">Gestión de Facultades</h5>
        <a href="/admin/facultades/nueva" class="btn btn-danger btn-sm"><i class="bi bi-plus"></i> Nueva Facultad</a>
    </div>

    <div class="main-content">
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card-table p-3">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="f : ${facultades}">
                        <td th:text="${f.id}"></td>
                        <td th:text="${f.nombre}"></td>
                        <td th:text="${f.descripcion}"></td>
                        <td>
                            <a th:href="@{/admin/facultades/editar/{id}(id=${f.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
                            <a th:href="@{/admin/facultades/eliminar/{id}(id=${f.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar esta facultad?')"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(facultades)}">
                        <td colspan="4" class="text-center text-muted">No hay facultades registradas</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
