<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Docentes - Saber Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .sidebar { background: #1e293b; min-height: 100vh; padding: 20px 0; width: 250px; position: fixed; }
        .sidebar .brand { color: #e94560; font-size: 20px; font-weight: 700; padding: 10px 20px 30px; }
        .sidebar a { display: block; color: #94a3b8; text-decoration: none; padding: 12px 20px; font-size: 14px; }
        .sidebar a:hover, .sidebar a.active { background: #0f172a; color: #e94560; }
        .sidebar a i { margin-right: 10px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .top-bar { background: #1e293b; padding: 15px 30px; margin-left: 250px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .card-table { background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
        table thead th { color: #94a3b8; border-color: #334155; font-size: 13px; }
        table tbody td { color: #e2e8f0; border-color: #334155; }
        table tbody tr:hover { background: #0f172a; }
    </style>

    <!-- Tema visual UTS agregado -->
    <style>
        :root{
            --uts-green:#0b8f3a;
            --uts-green-dark:#05642a;
            --uts-green-soft:#e9f8ef;
            --uts-lime:#8cc63f;
            --uts-text:#183225;
            --uts-muted:#68746d;
            --uts-border:#dce8df;
            --uts-bg:#f4f8f5;
        }
        body{
            background: radial-gradient(circle at top left, rgba(140,198,63,.22), transparent 35%), linear-gradient(135deg,#f6fbf7 0%,#eef7f0 45%,#ffffff 100%) !important;
            color: var(--uts-text) !important;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body::before{
            content:""; position:fixed; inset:0; pointer-events:none; opacity:.35;
            background-image: radial-gradient(var(--uts-green) 1px, transparent 1px);
            background-size: 28px 28px;
            z-index:-1;
        }
        .sidebar{
            background: linear-gradient(180deg,var(--uts-green-dark),var(--uts-green)) !important;
            box-shadow: 10px 0 28px rgba(5,100,42,.18);
        }
        .sidebar .brand{
            color:#fff !important; font-size:21px !important; letter-spacing:.2px;
        }
        .sidebar .brand::after{
            content:'Unidades Tecnológicas de Santander'; display:block; margin-top:6px;
            font-size:11px; color:rgba(255,255,255,.78); font-weight:500; line-height:1.2;
        }
        .sidebar a{ color:rgba(255,255,255,.82) !important; border-left:4px solid transparent; transition:all .2s ease; }
        .sidebar a:hover,.sidebar a.active{
            background:rgba(255,255,255,.14) !important; color:#fff !important; border-left-color:var(--uts-lime);
            transform:translateX(3px);
        }
        .top-bar{
            background:rgba(255,255,255,.92) !important; backdrop-filter:blur(10px);
            border-bottom:1px solid var(--uts-border) !important; color:var(--uts-text) !important;
            box-shadow:0 8px 24px rgba(24,50,37,.06);
        }
        .main-content{ animation: utsFade .45s ease both; }
        @keyframes utsFade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
        .stat-card, .card, .table-responsive{
            background:#fff !important; color:var(--uts-text) !important; border:1px solid var(--uts-border) !important;
            border-radius:18px !important; box-shadow:0 14px 34px rgba(24,50,37,.08) !important;
        }
        .stat-card{ transition:transform .18s ease, box-shadow .18s ease; }
        .stat-card:hover{ transform:translateY(-4px); box-shadow:0 18px 38px rgba(5,100,42,.14) !important; }
        .stat-card .number, .stat-card h6, h1, h2, h3, h4, h5{ color:var(--uts-green-dark) !important; }
        .stat-card .label, .text-muted{ color:var(--uts-muted) !important; }
        .btn-danger, .btn-primary, .btn-login{
            background:linear-gradient(135deg,var(--uts-green),var(--uts-green-dark)) !important; border-color:var(--uts-green) !important;
            color:#fff !important; box-shadow:0 8px 18px rgba(11,143,58,.22);
        }
        .btn-danger:hover, .btn-primary:hover, .btn-login:hover{ filter:brightness(.95); transform:translateY(-1px); }
        .btn-outline-danger, .btn-outline-primary{
            color:var(--uts-green-dark) !important; border-color:var(--uts-green) !important; background:#fff !important;
        }
        .btn-outline-danger:hover, .btn-outline-primary:hover{
            background:var(--uts-green) !important; color:#fff !important;
        }
        table{ color:var(--uts-text) !important; }
        thead, .table-dark{ background:var(--uts-green-dark) !important; color:#fff !important; }
        .table-striped>tbody>tr:nth-of-type(odd)>*{ background-color:var(--uts-green-soft) !important; color:var(--uts-text) !important; }
        .form-control, .form-select{
            background:#fff !important; color:var(--uts-text) !important; border:1px solid var(--uts-border) !important; border-radius:12px !important;
        }
        .form-control:focus, .form-select:focus{
            border-color:var(--uts-green) !important; box-shadow:0 0 0 .2rem rgba(11,143,58,.16) !important;
        }
        .form-label{ color:var(--uts-text) !important; font-weight:600; }
        .alert{ border-radius:14px !important; }
        .login-card{
            background:rgba(255,255,255,.94) !important; border:1px solid rgba(11,143,58,.18) !important;
            box-shadow:0 24px 65px rgba(5,100,42,.22) !important; color:var(--uts-text) !important; position:relative; overflow:hidden;
        }
        .login-card::before{
            content:'UTS'; position:absolute; top:18px; right:18px; width:58px; height:58px; border-radius:50%;
            display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--uts-green),var(--uts-lime));
            color:#fff; font-weight:800; letter-spacing:.8px; box-shadow:0 10px 22px rgba(11,143,58,.25);
        }
        .login-card h2{ color:var(--uts-green-dark) !important; margin-top:18px; }
        .login-card p.subtitle{ color:var(--uts-muted) !important; }
        .login-card p.subtitle::after{
            content:'\A Unidades Tecnológicas de Santander'; white-space:pre; display:block; color:var(--uts-green); font-weight:700; margin-top:7px;
        }
        @media(max-width:768px){ .sidebar{position:relative !important; width:100% !important; min-height:auto !important;} .main-content,.top-bar{margin-left:0 !important;} }
    </style>

    <link rel="stylesheet" th:href="@{/css/uts-theme.css}">
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="bi bi-mortarboard"></i> Saber Pro</div>
        <a href="/admin/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/admin/directores"><i class="bi bi-person-badge"></i> Directores</a>
        <a href="/admin/docentes" class="active"><i class="bi bi-person-workspace"></i> Docentes</a>
        <a href="/admin/facultades"><i class="bi bi-building"></i> Facultades</a>
        <a href="/admin/estudiantes"><i class="bi bi-people"></i> Estudiantes</a>
        <a href="/logout" style="position:absolute; bottom:20px; width:100%;"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a>
    </div>

    <div class="top-bar">
        <h5 class="mb-0">Gestión de Docentes</h5>
        <a href="/admin/docentes/nuevo" class="btn btn-danger btn-sm"><i class="bi bi-plus"></i> Nuevo Docente</a>
    </div>

    <div class="main-content">
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card-table p-3">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Cédula</th>
                        <th>Correo</th>
                        <th>Facultad</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d : ${docentes}">
                        <td th:text="${d.id}"></td>
                        <td th:text="${d.nombre + ' ' + d.apellido}"></td>
                        <td th:text="${d.cedula}"></td>
                        <td th:text="${d.correo}"></td>
                        <td th:text="${d.facultad != null ? d.facultad.nombre : 'Sin facultad'}"></td>
                        <td>
                            <a th:href="@{/admin/docentes/editar/{id}(id=${d.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
                            <a th:href="@{/admin/docentes/eliminar/{id}(id=${d.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar este docente?')"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(docentes)}">
                        <td colspan="6" class="text-center text-muted">No hay docentes registrados</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
