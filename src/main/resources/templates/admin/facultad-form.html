<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Facultad - Saber Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .sidebar {
            background: #1e293b;
            min-height: 100vh;
            padding: 20px 0;
            width: 250px;
            position: fixed;
        }
        .sidebar .brand { color: #e94560; font-size: 20px; font-weight: 700; padding: 10px 20px 30px; }
        .sidebar a { display: block; color: #94a3b8; text-decoration: none; padding: 12px 20px; font-size: 14px; }
        .sidebar a:hover, .sidebar a.active { background: #0f172a; color: #e94560; }
        .sidebar a i { margin-right: 10px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .top-bar { background: #1e293b; padding: 15px 30px; margin-left: 250px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .form-card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 30px; max-width: 600px; }
        .form-control, .form-select {
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
        }
        .form-control:focus, .form-select:focus {
            background: #0f172a;
            border-color: #e94560;
            color: #e2e8f0;
            box-shadow: none;
        }
        .form-label { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="bi bi-mortarboard"></i> Saber Pro</div>
        <a href="/admin/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/admin/directores"><i class="bi bi-person-badge"></i> Directores</a>
        <a href="/admin/docentes"><i class="bi bi-person-workspace"></i> Docentes</a>
        <a href="/admin/facultades" class="active"><i class="bi bi-building"></i> Facultades</a>
        <a href="/logout" style="position:absolute; bottom:20px; width:100%;"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a>
    </div>

    <div class="top-bar">
        <h5 class="mb-0" th:text="${facultad.id == null} ? 'Nueva Facultad' : 'Editar Facultad'">Facultad</h5>
        <a href="/admin/facultades" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>

    <div class="main-content">
        <div class="form-card">
            <form th:action="@{/admin/facultades/guardar}" th:object="${facultad}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label">Nombre de la Facultad *</label>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Facultad de Ingeniería" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3" placeholder="Descripción opcional"></textarea>
                </div>
                <button type="submit" class="btn btn-danger px-4"><i class="bi bi-save me-1"></i> Guardar</button>
                <a href="/admin/facultades" class="btn btn-outline-secondary ms-2">Cancelar</a>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
