<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Resultado - Saber Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .sidebar { background: #1e293b; min-height: 100vh; padding: 20px 0; width: 250px; position: fixed; }
        .sidebar .brand { color: #e94560; font-size: 20px; font-weight: 700; padding: 10px 20px 30px; }
        .sidebar a { display: block; color: #94a3b8; text-decoration: none; padding: 12px 20px; font-size: 14px; }
        .sidebar a:hover { background: #0f172a; color: #e94560; }
        .sidebar a i { margin-right: 10px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .top-bar { background: #1e293b; padding: 15px 30px; margin-left: 250px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .card-dark { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 28px; }
        .form-control, .form-select {
            background: rgba(255,255,255,0.05);
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 8px;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.08);
            border-color: #e94560;
            color: #e2e8f0;
            box-shadow: none;
        }
        .form-label { color: #94a3b8; font-size: 13px; margin-bottom: 5px; }
        .form-select option { background: #1e293b; }
        .section-title { color: #e94560; font-size: 13px; font-weight: 700; text-transform: uppercase;
                         letter-spacing: 1px; padding-bottom: 8px; border-bottom: 1px solid #334155; margin-bottom: 16px; }
        .btn-guardar { background: #e94560; border: none; color: #fff; padding: 10px 28px; border-radius: 8px; font-weight: 600; }
        .btn-guardar:hover { background: #c73652; color: #fff; }
        .info-estudiante { background: #0f172a; border-radius: 10px; padding: 14px 18px; margin-bottom: 24px; border-left: 4px solid #e94560; }
    </style>

    <!-- Tema visual UTS agregado -->
    <style>
        :root{
            --uts-green:#0b8f3a;
            --uts-green-dark:#05642a;
            --uts-green-soft:#e9f8ef;
            --uts-lime:#8cc63f;
            --uts-text:#183225;
            --uts-muted:#68746d;
            --uts-border:#dce8df;
            --uts-bg:#f4f8f5;
        }
        body{
            background: radial-gradient(circle at top left, rgba(140,198,63,.22), transparent 35%), linear-gradient(135deg,#f6fbf7 0%,#eef7f0 45%,#ffffff 100%) !important;
            color: var(--uts-text) !important;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body::before{
            content:""; position:fixed; inset:0; pointer-events:none; opacity:.35;
            background-image: radial-gradient(var(--uts-green) 1px, transparent 1px);
            background-size: 28px 28px;
            z-index:-1;
        }
        .sidebar{
            background: linear-gradient(180deg,var(--uts-green-dark),var(--uts-green)) !important;
            box-shadow: 10px 0 28px rgba(5,100,42,.18);
        }
        .sidebar .brand{
            color:#fff !important; font-size:21px !important; letter-spacing:.2px;
        }
        .sidebar .brand::after{
            content:'Unidades Tecnológicas de Santander'; display:block; margin-top:6px;
            font-size:11px; color:rgba(255,255,255,.78); font-weight:500; line-height:1.2;
        }
        .sidebar a{ color:rgba(255,255,255,.82) !important; border-left:4px solid transparent; transition:all .2s ease; }
        .sidebar a:hover,.sidebar a.active{
            background:rgba(255,255,255,.14) !important; color:#fff !important; border-left-color:var(--uts-lime);
            transform:translateX(3px);
        }
        .top-bar{
            background:rgba(255,255,255,.92) !important; backdrop-filter:blur(10px);
            border-bottom:1px solid var(--uts-border) !important; color:var(--uts-text) !important;
            box-shadow:0 8px 24px rgba(24,50,37,.06);
        }
        .main-content{ animation: utsFade .45s ease both; }
        @keyframes utsFade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
        .stat-card, .card, .table-responsive{
            background:#fff !important; color:var(--uts-text) !important; border:1px solid var(--uts-border) !important;
            border-radius:18px !important; box-shadow:0 14px 34px rgba(24,50,37,.08) !important;
        }
        .stat-card{ transition:transform .18s ease, box-shadow .18s ease; }
        .stat-card:hover{ transform:translateY(-4px); box-shadow:0 18px 38px rgba(5,100,42,.14) !important; }
        .stat-card .number, .stat-card h6, h1, h2, h3, h4, h5{ color:var(--uts-green-dark) !important; }
        .stat-card .label, .text-muted{ color:var(--uts-muted) !important; }
        .btn-danger, .btn-primary, .btn-login{
            background:linear-gradient(135deg,var(--uts-green),var(--uts-green-dark)) !important; border-color:var(--uts-green) !important;
            color:#fff !important; box-shadow:0 8px 18px rgba(11,143,58,.22);
        }
        .btn-danger:hover, .btn-primary:hover, .btn-login:hover{ filter:brightness(.95); transform:translateY(-1px); }
        .btn-outline-danger, .btn-outline-primary{
            color:var(--uts-green-dark) !important; border-color:var(--uts-green) !important; background:#fff !important;
        }
        .btn-outline-danger:hover, .btn-outline-primary:hover{
            background:var(--uts-green) !important; color:#fff !important;
        }
        table{ color:var(--uts-text) !important; }
        thead, .table-dark{ background:var(--uts-green-dark) !important; color:#fff !important; }
        .table-striped>tbody>tr:nth-of-type(odd)>*{ background-color:var(--uts-green-soft) !important; color:var(--uts-text) !important; }
        .form-control, .form-select{
            background:#fff !important; color:var(--uts-text) !important; border:1px solid var(--uts-border) !important; border-radius:12px !important;
        }
        .form-control:focus, .form-select:focus{
            border-color:var(--uts-green) !important; box-shadow:0 0 0 .2rem rgba(11,143,58,.16) !important;
        }
        .form-label{ color:var(--uts-text) !important; font-weight:600; }
        .alert{ border-radius:14px !important; }
        .login-card{
            background:rgba(255,255,255,.94) !important; border:1px solid rgba(11,143,58,.18) !important;
            box-shadow:0 24px 65px rgba(5,100,42,.22) !important; color:var(--uts-text) !important; position:relative; overflow:hidden;
        }
        .login-card::before{
            content:'UTS'; position:absolute; top:18px; right:18px; width:58px; height:58px; border-radius:50%;
            display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--uts-green),var(--uts-lime));
            color:#fff; font-weight:800; letter-spacing:.8px; box-shadow:0 10px 22px rgba(11,143,58,.25);
        }
        .login-card h2{ color:var(--uts-green-dark) !important; margin-top:18px; }
        .login-card p.subtitle{ color:var(--uts-muted) !important; }
        .login-card p.subtitle::after{
            content:'\A Unidades Tecnológicas de Santander'; white-space:pre; display:block; color:var(--uts-green); font-weight:700; margin-top:7px;
        }
        @media(max-width:768px){ .sidebar{position:relative !important; width:100% !important; min-height:auto !important;} .main-content,.top-bar{margin-left:0 !important;} }
    </style>

    <link rel="stylesheet" th:href="@{/css/uts-theme.css}">
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="bi bi-mortarboard"></i> Saber Pro</div>
        <a href="/coordinacion/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/coordinacion/informes"><i class="bi bi-file-earmark-bar-graph"></i> Informes</a>

    <a href="/coordinacion/estudiantes" class="active"><i class="bi bi-people"></i> Estudiantes</a>
        <a href="/logout" style="position:absolute; bottom:20px; width:100%;"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a>
    </div>

    <div class="top-bar">
        <h5 class="mb-0">Cargar Resultado Saber Pro</h5>
        <span class="text-muted" th:text="${#authentication.name}">coordinacion</span>
    </div>

    <div class="main-content">

        <!-- Info estudiante -->
        <div class="info-estudiante">
            <span style="color:#94a3b8; font-size:12px;">Cargando resultado para</span>
            <h6 class="mb-0 mt-1" th:text="${estudiante.primerNombre + ' ' + estudiante.primerApellido + ' — ' + estudiante.numeroDocumento}">Nombre</h6>
        </div>

        <div class="card-dark">
            <form th:action="@{/coordinacion/estudiantes/{id}/resultados/guardar(id=${estudiante.id})}"
                  th:object="${resultado}" method="post">

                <!-- Datos generales -->
                <div class="section-title"><i class="bi bi-file-text me-1"></i> Datos Generales</div>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label">N° de Registro</label>
                        <input type="text" th:field="*{numeroRegistro}" class="form-control" placeholder="Ej: 2024-001" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Puntaje Total</label>
                        <input type="number" step="0.01" th:field="*{puntajeTotal}" class="form-control" placeholder="0.00">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Nivel Global</label>
                        <select th:field="*{nivelGlobal}" class="form-select">
                            <option value="">-- Seleccionar --</option>
                            <option value="ALTO">Alto</option>
                            <option value="MEDIO">Medio</option>
                            <option value="BAJO">Bajo</option>
                        </select>
                    </div>
                </div>

                <!-- Competencias genéricas -->
                <div class="section-title"><i class="bi bi-bar-chart me-1"></i> Competencias Genéricas</div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Comunicación Escrita</label>
                        <div class="input-group">
                            <input type="number" step="0.01" th:field="*{comunicacionEscrita}" class="form-control" placeholder="Puntaje">
                            <select th:field="*{comunicacionEscritaNivel}" class="form-select">
                                <option value="">Nivel</option>
                                <option value="ALTO">Alto</option>
                                <option value="MEDIO">Medio</option>
                                <option value="BAJO">Bajo</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Razonamiento Cuantitativo</label>
                        <div class="input-group">
                            <input type="number" step="0.01" th:field="*{razonamientoCuantitativo}" class="form-control" placeholder="Puntaje">
                            <select th:field="*{razonamientoCuantitativoNivel}" class="form-select">
                                <option value="">Nivel</option>
                                <option value="ALTO">Alto</option>
                                <option value="MEDIO">Medio</option>
                                <option value="BAJO">Bajo</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Lectura Crítica</label>
                        <div class="input-group">
                            <input type="number" step="0.01" th:field="*{lecturaCritica}" class="form-control" placeholder="Puntaje">
                            <select th:field="*{lecturaCriticaNivel}" class="form-select">
                                <option value="">Nivel</option>
                                <option value="ALTO">Alto</option>
                                <option value="MEDIO">Medio</option>
                                <option value="BAJO">Bajo</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Competencias Ciudadanas</label>
                        <div class="input-group">
                            <input type="number" step="0.01" th:field="*{competenciasCiudadanas}" class="form-control" placeholder="Puntaje">
                            <select th:field="*{competenciasCiudadanasNivel}" class="form-select">
                                <option value="">Nivel</option>
                                <option value="ALTO">Alto</option>
                                <option value="MEDIO">Medio</option>
                                <option value="BAJO">Bajo</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Inglés -->
                <div class="section-title"><i class="bi bi-translate me-1"></i> Inglés</div>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label">Puntaje Inglés</label>
                        <input type="number" step="0.01" th:field="*{ingles}" class="form-control" placeholder="0.00">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Nivel</label>
                        <select th:field="*{inglesNivel}" class="form-select">
                            <option value="">-- Seleccionar --</option>
                            <option value="ALTO">Alto</option>
                            <option value="MEDIO">Medio</option>
                            <option value="BAJO">Bajo</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Nivel Detalle (MCER)</label>
                        <select th:field="*{inglesNivelDetalle}" class="form-select">
                            <option value="">-- Seleccionar --</option>
                            <option value="A0">A0</option>
                            <option value="A1">A1</option>
                            <option value="A2">A2</option>
                            <option value="B1">B1</option>
                            <option value="B2">B2</option>
                        </select>
                    </div>
                </div>

                <!-- Competencias específicas -->
                <div class="section-title"><i class="bi bi-cpu me-1"></i> Competencias Específicas</div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Formulación de Proyectos</label>
                        <div class="input-group">
                            <input type="number" step="0.01" th:field="*{formulacionProyectos}" class="form-control" placeholder="Puntaje">
                            <select th:field="*{formulacionProyectosNivel}" class="form-select">
                                <option value="">Nivel</option>
                                <option value="ALTO">Alto</option>
                                <option value="MEDIO">Medio</option>
                                <option value="BAJO">Bajo</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Pensamiento Científico</label>
                        <div class="input-group">
                            <input type="number" step="0.01" th:field="*{pensamientoCientifico}" class="form-control" placeholder="Puntaje">
                            <select th:field="*{pensamientoCientificoNivel}" class="form-select">
                                <option value="">Nivel</option>
                                <option value="ALTO">Alto</option>
                                <option value="MEDIO">Medio</option>
                                <option value="BAJO">Bajo</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Diseño de Software</label>
                        <div class="input-group">
                            <input type="number" step="0.01" th:field="*{disenoSoftware}" class="form-control" placeholder="Puntaje">
                            <select th:field="*{disenoSoftwareNivel}" class="form-select">
                                <option value="">Nivel</option>
                                <option value="ALTO">Alto</option>
                                <option value="MEDIO">Medio</option>
                                <option value="BAJO">Bajo</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Botones -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-guardar">
                        <i class="bi bi-save me-1"></i> Guardar Resultado
                    </button>
                    <a th:href="@{/coordinacion/estudiantes/{id}/resultados(id=${estudiante.id})}"
                       class="btn" style="background:#334155; color:#94a3b8; border-radius:8px;">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
