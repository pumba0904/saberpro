<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultados - Saber Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .sidebar { background: #1e293b; min-height: 100vh; padding: 20px 0; width: 250px; position: fixed; }
        .sidebar .brand { color: #e94560; font-size: 20px; font-weight: 700; padding: 10px 20px 30px; }
        .sidebar a { display: block; color: #94a3b8; text-decoration: none; padding: 12px 20px; font-size: 14px; }
        .sidebar a:hover, .sidebar a.active { background: #0f172a; color: #e94560; }
        .sidebar a i { margin-right: 10px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .top-bar { background: #1e293b; padding: 15px 30px; margin-left: 250px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .card-dark { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 24px; }
        .table { color: #e2e8f0; }
        .table thead th { background: #0f172a; color: #94a3b8; border-color: #334155; font-size: 13px; }
        .table tbody td { border-color: #334155; font-size: 14px; vertical-align: middle; }
        .table tbody tr:hover { background: #0f172a; }
        .badge-nivel { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .nivel-alto { background: rgba(34,197,94,0.15); color: #22c55e; }
        .nivel-medio { background: rgba(234,179,8,0.15); color: #eab308; }
        .nivel-bajo { background: rgba(239,68,68,0.15); color: #ef4444; }
        .info-estudiante { background: #0f172a; border-radius: 10px; padding: 16px 20px; margin-bottom: 24px; border-left: 4px solid #e94560; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="bi bi-mortarboard"></i> Saber Pro</div>
        <a href="/coordinacion/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/coordinacion/estudiantes" class="active"><i class="bi bi-people"></i> Estudiantes</a>
        <a href="/logout" style="position:absolute; bottom:20px; width:100%;"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a>
    </div>

    <div class="top-bar">
        <h5 class="mb-0">Resultados Saber Pro</h5>
        <span class="text-muted" th:text="${#authentication.name}">coordinacion</span>
    </div>

    <div class="main-content">

        <!-- Info estudiante -->
        <div class="info-estudiante">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span style="color:#94a3b8; font-size:13px;">Estudiante</span>
                    <h5 class="mb-0 mt-1" th:text="${estudiante.primerNombre + ' ' + estudiante.primerApellido}">Nombre</h5>
                    <small style="color:#64748b;" th:text="${estudiante.tipoDocumento + ': ' + estudiante.numeroDocumento}">CC: 123</small>
                </div>
                <a th:href="@{/coordinacion/estudiantes/{id}/resultados/nuevo(id=${estudiante.id})}"
                   class="btn btn-sm" style="background:#e94560; color:#fff; border-radius:8px;">
                    <i class="bi bi-plus-lg me-1"></i> Nuevo Resultado
                </a>
            </div>
        </div>

        <!-- Mensaje -->
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible mb-4" style="background:rgba(34,197,94,0.1); border:1px solid #22c55e; color:#22c55e; border-radius:10px;">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>

        <!-- Tabla resultados -->
        <div class="card-dark">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>N° Registro</th>
                        <th>Fecha</th>
                        <th>Puntaje Total</th>
                        <th>Nivel Global</th>
                        <th>Inglés</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(resultados)}">
                        <td colspan="6" class="text-center py-4" style="color:#64748b;">
                            <i class="bi bi-inbox fs-4 d-block mb-2"></i>
                            No hay resultados registrados
                        </td>
                    </tr>
                    <tr th:each="r : ${resultados}">
                        <td th:text="${r.numeroRegistro}">-</td>
                        <td th:text="${r.fechaCargue}">-</td>
                        <td>
                            <strong style="color:#e94560;" th:text="${r.puntajeTotal}">0</strong>
                        </td>
                        <td>
                            <span class="badge-nivel nivel-medio" th:text="${r.nivelGlobal}">-</span>
                        </td>
                        <td>
                            <span th:text="${r.inglesNivelDetalle}">-</span>
                        </td>
                        <td>
                            <a th:href="@{/coordinacion/estudiantes/{id}/resultados/eliminar/{rid}(id=${estudiante.id}, rid=${r.id})}"
                               class="btn btn-sm"
                               style="background:rgba(239,68,68,0.15); color:#ef4444; border-radius:6px;"
                               onclick="return confirm('¿Eliminar este resultado?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-3">
            <a href="/coordinacion/estudiantes" class="btn btn-sm" style="color:#94a3b8;">
                <i class="bi bi-arrow-left me-1"></i> Volver a estudiantes
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
